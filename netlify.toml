[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers — applied to every response.
# CSP is intentionally permissive so Sanity, Algolia, Mux, Sentry, FontAwesome,
# and Simple Analytics keep working. Verify the site loads in all browsers
# before tightening any directive.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src https:;"
